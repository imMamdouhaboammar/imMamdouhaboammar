<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mamdouh Aboammar</title>
  <desc id="desc">Digital direction, brand strategy, and public systems built from recurring problems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090D18"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F97316"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".06"/></pattern>
    <style>
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .flow{animation:dash 10s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-72}}
      @media(prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#334155"/>

  <g class="sans">
    <text x="58" y="70" fill="#94A3B8" font-size="14" font-weight="650" letter-spacing="2.4">DIGITAL DIRECTION / BRAND STRATEGY / PUBLIC SYSTEMS</text>
    <text x="58" y="136" fill="#F8FAFC" font-size="52" font-weight="820" letter-spacing="-1.4">Mamdouh Aboammar</text>
    <rect x="58" y="158" width="510" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="58" y="205" fill="#CBD5E1" font-size="22" font-weight="520">Real friction. Reusable systems. Public proof.</text>
  </g>

  <g transform="translate(710 70)">
    <rect width="430" height="160" rx="16" fill="#0B1220" stroke="#334155"/>
    <g class="mono" font-size="15">
      <text x="24" y="39" fill="#64748B">build loop</text>
      <text x="24" y="76" fill="#F97316">problem</text><text x="95" y="76" fill="#64748B">/</text>
      <text x="112" y="76" fill="#A78BFA">system</text><text x="170" y="76" fill="#64748B">/</text>
      <text x="187" y="76" fill="#38BDF8">test</text><text x="224" y="76" fill="#64748B">/</text>
      <text x="241" y="76" fill="#4ADE80">ship</text><text x="278" y="76" fill="#64748B">/</text>
      <text x="295" y="76" fill="#FACC15">learn</text>
      <path class="flow" d="M24 101H406" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 8"/>
      <text x="24" y="135" fill="#CBD5E1">friction.repeats() → build.public()</text>
    </g>
  </g>

  <text class="sans" x="58" y="264" fill="#64748B" font-size="13" letter-spacing="1.2">EGYPT / SAUDI ARABIA / UAE / QATAR / CANADA</text>
</svg>
