version: 1
refreshed: 2026-09-09
purpose: capability-routing-registry

principles:
  primary_owner_count: 1
  one_write_owner_per_surface: true
  current_state_beats_memory: true
  mutation_invalidates_verification: true
  reviewer_is_not_executable_proof: true
  landing_owner_count: 1

availability_snapshot:
