name: Fix Arabic profile bidi and contacts

on:
  push:
    branches:
      - profile/fix-arabic-bidi-contacts
    paths:
      - .github/workflows/profile-arabic-bidi-contact-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: profile/fix-arabic-bidi-contacts
          fetch-depth: 0

      - name: Apply bidi-safe Arabic rendering and contact links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text()

          start = '<a id="arabic-version"></a>\n\n<details dir="rtl">\n<summary dir="rtl"><strong>🇪🇬 لو أنا في شركتك، هبقى بساعد فريقك إزاي؟</strong></summary>\n\n<br>\n\n'
          end = '\n\n</details>\n\n<br>\n\n<a id="english-version"></a>'

          if text.count(start) != 1:
              raise SystemExit(f'Arabic start marker count: {text.count(start)}')
          if text.count(end) != 1:
              raise SystemExit(f'Arabic end marker count: {text.count(end)}')

          before, rest = text.split(start, 1)
          arabic, after = rest.split(end, 1)

          if '<div dir="rtl" align="right">' in arabic:
              raise SystemExit('Arabic content is already wrapped in explicit RTL container')

          latin_run = re.compile(r"[A-Za-z][A-Za-z0-9+./_'’-]*(?:[ \t]+[A-Za-z0-9][A-Za-z0-9+./_'’-]*)*")

          def isolate_line(line: str) -> str:
              if '](' in line or 'http://' in line or 'https://' in line:
                  return line

              protected = []

              def hold(match):
                  idx = len(protected)
                  protected.append(match.group(0))
                  return f'\ue000{idx}\ue001'

              line = re.sub(r'`[^`]+`', hold, line)
              line = re.sub(r'<[^>]+>', hold, line)
              line = latin_run.sub(lambda m: f'<span dir="ltr">{m.group(0)}</span>', line)

              for idx, value in enumerate(protected):
                  line = line.replace(f'\ue000{idx}\ue001', value)
              return line

          arabic = '\n'.join(isolate_line(line) for line in arabic.split('\n'))

          arabic = arabic.replace(
              '`Code` · `Git` · `PRs` · `Testing` · `Maintenance` · `Tech Product` · `PRDs` · `Technical Writing` · `AI-assisted work` · وخصوصا **إزاي نفكر قبل ما نطلب من حد يبني**',
              '<div dir="ltr" align="right"><code>Code</code> · <code>Git</code> · <code>PRs</code> · <code>Testing</code> · <code>Maintenance</code> · <code>Tech Product</code> · <code>PRDs</code> · <code>Technical Writing</code> · <code>AI-assisted work</code></div>\n\n**وخصوصا إزاي نفكر قبل ما نطلب من حد يبني**'
          )
          arabic = arabic.replace(
              '`PR` · `Issue` · `Doc` · `Research note` · `Decision` · `Test evidence` · `Skill` · `Checklist`',
              '<div dir="ltr" align="right"><code>PR</code> · <code>Issue</code> · <code>Doc</code> · <code>Research note</code> · <code>Decision</code> · <code>Test evidence</code> · <code>Skill</code> · <code>Checklist</code></div>'
          )

          old_ar_contact = '**[LinkedIn](https://www.linkedin.com/in/mamdouh-aboammar/) · [Website](https://mamdouhaboammar.com/)**'
          new_ar_contact = '\n'.join([
              '**الإيميل:** <a dir="ltr" href="mailto:mamdouhfces1997@gmail.com">mamdouhfces1997@gmail.com</a><br>',
              '**واتساب:** <a href="https://wa.me/201092677269">راسلني مباشرة</a><br>',
              '**لينكدإن:** <a dir="ltr" href="https://www.linkedin.com/in/mamdouh-aboammar/">Mamdouh Aboammar</a><br>',
              '**الموقع:** <a dir="ltr" href="https://mamdouhaboammar.com/">mamdouhaboammar.com</a>',
          ])
          if arabic.count(old_ar_contact) != 1:
              raise SystemExit(f'Arabic contact marker count: {arabic.count(old_ar_contact)}')
          arabic = arabic.replace(old_ar_contact, new_ar_contact, 1)

          arabic = '<div dir="rtl" align="right">\n\n' + arabic + '\n\n</div>'
          text = before + start + arabic + end + after

          old_en_contact = '**[LinkedIn](https://www.linkedin.com/in/mamdouh-aboammar/) · [Website](https://mamdouhaboammar.com/)**'
          new_en_contact = '\n'.join([
              '**Email:** [mamdouhfces1997@gmail.com](mailto:mamdouhfces1997@gmail.com)<br>',
              '**WhatsApp:** [Message me directly](https://wa.me/201092677269)<br>',
              '**LinkedIn:** [Mamdouh Aboammar](https://www.linkedin.com/in/mamdouh-aboammar/)<br>',
              '**Website:** [mamdouhaboammar.com](https://mamdouhaboammar.com/)',
          ])
          if text.count(old_en_contact) != 1:
              raise SystemExit(f'English contact marker count: {text.count(old_en_contact)}')
          text = text.replace(old_en_contact, new_en_contact, 1)

          path.write_text(text)
          PY

      - name: Verify and commit clean README-only result
        shell: bash
        run: |
          rm -f .github/workflows/profile-arabic-bidi-contact-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text()
          ar = text.split('<a id="arabic-version"></a>', 1)[1].split('<a id="english-version"></a>', 1)[0]
          assert '<details dir="rtl">' in ar
          assert '<div dir="rtl" align="right">' in ar
          assert '<span dir="ltr">Software Engineer</span>' in ar
          assert '<span dir="ltr">Issue discovery</span>' in ar
          assert '<span dir="ltr">Small</span>' in ar
          assert 'mailto:mamdouhfces1997@gmail.com' in ar
          assert 'https://wa.me/201092677269' in ar
          assert '<details open' not in ar
          assert text.count('mailto:mamdouhfces1997@gmail.com') == 2
          assert text.count('https://wa.me/201092677269') == 2
          PY

          git diff --cached --check
          git commit -m "docs(profile): fix Arabic bidi and add direct contacts"
          git push origin HEAD:profile/fix-arabic-bidi-contacts
