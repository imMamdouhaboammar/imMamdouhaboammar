name: Portfolio interview skill checks

on:
  pull_request:
    paths:
      - ".claude/skills/portfolio-interview/**"
      - ".github/workflows/portfolio-skill-check.yml"
  push:
    paths:
      - ".claude/skills/portfolio-interview/**"
      - ".github/workflows/portfolio-skill-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build fixtures, run static checks, confirm the invalid fixture fails
        run: node .claude/skills/portfolio-interview/scripts/selftest.mjs
