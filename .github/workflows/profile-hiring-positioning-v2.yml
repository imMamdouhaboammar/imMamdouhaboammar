name: Apply profile hiring positioning v2

on:
  push:
    branches:
      - profile/hiring-positioning-v2
    paths:
      - .github/workflows/profile-hiring-positioning-v2.yml
      - profile_rewrite.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: profile/hiring-positioning-v2
          fetch-depth: 0

      - name: Apply README rewrite
        run: python profile_rewrite.py

      - name: Verify README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text()
          gold = ['dokion','get-fable','Rafiq-Bot','pymc-marketing-mcp','delegate-team','agent-kernel','riqor','unslop-preflight','marketing-council-pack','omni-skill','linkedin-animated-infographics','designly','whatsapp-ai-supervisor']
          assert 'Product_Architect-in_training' in text
          assert 'Freelance' in text and 'Full--time' in text and 'Part--time' in text
          assert 'Saudi_Arabia' in text and 'UAE' in text and 'GCC' in text
          assert text.index('<a id="english-version"></a>') < text.index('<a id="arabic-version"></a>')
          assert '<details open>' not in text
          assert '## Active focus' in text
          assert '<summary><strong>More public systems</strong>' in text
          assert '#### [Riftbook]' in text
          assert '## Where I came from' in text
          assert "## What I'm studying" in text
          assert 'Pushonomics · what agent-assisted building costs me' in text
          assert text.count('mailto:mamdouhfces1997@gmail.com') >= 2
          assert text.count('https://wa.me/201092677269') >= 2
          assert '—' not in text
          active = text[text.index('## Active focus'):text.index('<summary><strong>More public systems</strong>')]
          more = text[text.index('<summary><strong>More public systems</strong>'):text.index('## Where I came from')]
          for slug in gold:
              url = f'https://github.com/imMamdouhaboammar/{slug}'
              assert url in active, slug
              assert url not in more, f'duplicate gold repo in more section: {slug}'
          PY
          git diff --check

      - name: Commit and verify final branch diff
        shell: bash
        run: |
          rm -f profile_rewrite.py .github/workflows/profile-hiring-positioning-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(profile): sharpen hiring positioning and active work"
          git push origin HEAD:profile/hiring-positioning-v2
          git fetch origin main
          test "$(git diff --name-only origin/main...HEAD)" = "README.md"
