name: Make English profile version primary

on:
  push:
    branches:
      - profile/english-primary-arabic-supportive
    paths:
      - .github/workflows/profile-english-primary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: profile/english-primary-arabic-supportive
          fetch-depth: 0

      - name: Reorder bilingual profile blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          old_rows = '<tr>\n<td align="center" width="180"><a href="#arabic-version"><strong>🇪🇬 العربية</strong></a></td>\n<td align="center" width="180"><a href="#english-version"><strong>🇬🇧 English</strong></a></td>\n</tr>'
          new_rows = '<tr>\n<td align="center" width="180"><a href="#english-version"><strong>🇬🇧 English</strong></a></td>\n<td align="center" width="180"><a href="#arabic-version"><strong>🇪🇬 العربية</strong></a></td>\n</tr>'

          if text.count(old_rows) != 1:
              raise SystemExit(f'switcher row count: {text.count(old_rows)}')
          text = text.replace(old_rows, new_rows, 1)

          old_note = '<sub>Two versions, same idea. Pick the one that reads better for you.</sub>'
          new_note = '<sub>English is the main version. Arabic follows below.</sub>'
          if text.count(old_note) != 1:
              raise SystemExit(f'note count: {text.count(old_note)}')
          text = text.replace(old_note, new_note, 1)

          ar_anchor = '<a id="arabic-version"></a>'
          en_anchor = '<a id="english-version"></a>'
          suffix_marker = '<br>\n\n<div align="center">\n\n<img src="https://img.shields.io/badge/Real_friction-A371F7?style=flat-square&labelColor=0D1117" alt="Real friction">'

          if text.count(ar_anchor) != 1 or text.count(en_anchor) != 1 or text.count(suffix_marker) != 1:
              raise SystemExit('language block markers are not unique')

          prefix, after_ar_anchor = text.split(ar_anchor, 1)
          ar_body, after_en_anchor = after_ar_anchor.split(en_anchor, 1)
          en_body, suffix_rest = after_en_anchor.split(suffix_marker, 1)

          ar_block = ar_anchor + ar_body
          en_block = en_anchor + en_body

          if '[English ↓](#english-version)' not in ar_block:
              raise SystemExit('Arabic navigation marker missing')
          if '[↑ العربية](#arabic-version)' not in en_block:
              raise SystemExit('English navigation marker missing')

          ar_block = ar_block.replace('[English ↓](#english-version)', '[↑ English](#english-version)', 1)
          en_block = en_block.replace('[↑ العربية](#arabic-version)', '[العربية ↓](#arabic-version)', 1)

          en_block = en_block.rstrip() + '\n\n<br>\n\n'
          ar_block = ar_block.strip() + '\n\n'

          text = prefix + en_block + ar_block + suffix_marker + suffix_rest
          path.write_text(text)
          PY

      - name: Verify and commit README-only result
        shell: bash
        run: |
          rm -f .github/workflows/profile-english-primary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text()
          en = text.index('<a id="english-version"></a>')
          ar = text.index('<a id="arabic-version"></a>')
          public = text.index('## Public systems')
          assert en < ar < public
          assert '<details dir="ltr">' in text[en:ar]
          assert '<details dir="rtl">' in text[ar:public]
          assert '<details open' not in text[en:public]
          assert '[العربية ↓](#arabic-version)' in text[en:ar]
          assert '[↑ English](#english-version)' in text[ar:public]
          assert '<sub>English is the main version. Arabic follows below.</sub>' in text
          assert text.count('mailto:mamdouhfces1997@gmail.com') == 2
          assert text.count('https://wa.me/201092677269') == 2
          PY

          git diff --cached --check
          git commit -m "docs(profile): make English primary and Arabic supportive"
          git push origin HEAD:profile/english-primary-arabic-supportive
