name: Meme skill checks

on:
  pull_request:
    paths:
      - ".claude/skills/meme-marketing/**"
      - ".github/workflows/meme-skill-check.yml"
  push:
    paths:
      - ".claude/skills/meme-marketing/**"
      - ".github/workflows/meme-skill-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests and corpus checks
        run: python .claude/skills/meme-marketing/scripts/test_validate.py
      - name: Check valid example
        run: python .claude/skills/meme-marketing/scripts/validate.py .claude/skills/meme-marketing/evals/fixtures/valid.json
      - name: Require invalid example to fail
        shell: bash
        run: |
          if python .claude/skills/meme-marketing/scripts/validate.py .claude/skills/meme-marketing/evals/fixtures/invalid.json; then
            echo "Invalid example unexpectedly passed"
            exit 1
          fi
