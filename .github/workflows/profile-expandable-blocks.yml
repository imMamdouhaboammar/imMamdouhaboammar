name: Make profile language blocks expandable

on:
  push:
    branches:
      - profile/expandable-language-blocks
    paths:
      - .github/workflows/profile-expandable-blocks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: profile/expandable-language-blocks
          fetch-depth: 0

      - name: Wrap bilingual sections in details blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text()

          arabic_open = '<a id="arabic-version"></a>\n\n## 🇪🇬 لو أنا في شركتك، هبقى بساعد فريقك إزاي؟\n\n'
          english_open = '<a id="english-version"></a>\n\n## 🇬🇧 What would I actually do on your team?\n\n'
          english_end = '\n\n<br>\n\n<div align="center">\n\n<img src="https://img.shields.io/badge/Real_friction'

          for needle, label in [
              (arabic_open, 'Arabic opening'),
              (english_open, 'English opening'),
              (english_end, 'English closing point'),
          ]:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')

          text = text.replace(
              arabic_open,
              '<a id="arabic-version"></a>\n\n<details open>\n<summary><strong>🇪🇬 لو أنا في شركتك، هبقى بساعد فريقك إزاي؟</strong></summary>\n\n<br>\n\n',
              1,
          )

          text = text.replace(
              english_open,
              '</details>\n\n<br>\n\n<a id="english-version"></a>\n\n<details>\n<summary><strong>🇬🇧 What would I actually do on your team?</strong></summary>\n\n<br>\n\n',
              1,
          )

          text = text.replace(
              english_end,
              '\n\n</details>\n\n<br>\n\n<div align="center">\n\n<img src="https://img.shields.io/badge/Real_friction',
              1,
          )

          p.write_text(text)
          PY

      - name: Commit README-only result
        shell: bash
        run: |
          rm -f .github/workflows/profile-expandable-blocks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(profile): make language blocks expandable"
          git push origin HEAD:profile/expandable-language-blocks
