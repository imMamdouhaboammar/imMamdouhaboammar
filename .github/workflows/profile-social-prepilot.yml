name: Apply profile social icons and PrePilot author block

on:
  push:
    branches:
      - profile/social-icons-prepilot-author
    paths:
      - .github/workflows/profile-social-prepilot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: profile/social-icons-prepilot-author
          fetch-depth: 0

      - name: Apply README update
        run: python profile_social_prepilot.py

      - name: Verify README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text()
          expected = [
              'https://wa.me/201092677269',
              'https://mamdouhaboammar.com/',
              'https://www.instagram.com/boammarrr/',
              'mailto:mamdouhfces1997@gmail.com',
              'https://x.com/Bo_ammarrr',
              'https://www.facebook.com/mamdouhboammar',
              'https://www.linkedin.com/in/mamdouh-aboammar/',
          ]
          for value in expected:
              assert value in text, value
          assert 'cdn.simpleicons.org/whatsapp/25D366' in text
          assert 'cdn.simpleicons.org/instagram/E4405F' in text
          assert 'cdn.simpleicons.org/facebook/0866FF' in text
          assert 'cdn.simpleicons.org/linkedin/0A66C2' in text
          assert '<summary><strong>Author of PrePilot</strong> · 526 marketing workflows for ChatGPT & Claude</summary>' in text
          assert 'https://app.prepilot-system-agency.space/' in text
          assert text.index('Author of PrePilot') < text.index('## So... what would I actually do on your team?')
          assert '—' not in text
          PY
          git diff --check

      - name: Commit README-only result
        shell: bash
        run: |
          rm -f profile_social_prepilot.py .github/workflows/profile-social-prepilot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(profile): add social icons and PrePilot author block"
          git push origin HEAD:profile/social-icons-prepilot-author
