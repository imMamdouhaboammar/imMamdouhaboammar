name: Improve profile X icon contrast

on:
  push:
    branches:
      - profile/social-icons-prepilot-author
    paths:
      - .github/workflows/profile-social-x-contrast.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile/social-icons-prepilot-author
          fetch-depth: 0
      - shell: bash
        run: |
          sed -i 's#https://cdn.simpleicons.org/x/FFFFFF#https://cdn.simpleicons.org/x/6E7781#' README.md
          grep -q 'cdn.simpleicons.org/x/6E7781' README.md
          rm -f .github/workflows/profile-social-x-contrast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(profile): improve X icon contrast"
          git push origin HEAD:profile/social-icons-prepilot-author
