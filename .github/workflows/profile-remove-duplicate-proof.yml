name: Remove duplicate profile proof lists

on:
  push:
    branches:
      - profile/remove-duplicate-proof-list
    paths:
      - .github/workflows/profile-remove-duplicate-proof.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: profile/remove-duplicate-proof-list
          fetch-depth: 0

      - name: Remove duplicated proof sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          ar_start = '### حاجات لسه بتعلمها، بس عندي شغل تقدر تفتحه وتحكم بنفسك\n'
          ar_end = '### عندك <span dir="ltr">Job Offer</span>؟\n'
          en_start = '### Things I\'m still learning, but can already show work for\n'
          en_end = '### Have a job offer?\n'

          for marker in (ar_start, ar_end, en_start, en_end):
              if text.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one marker, got {text.count(marker)}: {marker!r}')

          ar_before, ar_rest = text.split(ar_start, 1)
          _, ar_after = ar_rest.split(ar_end, 1)
          text = ar_before.rstrip() + '\n\n' + ar_end + ar_after

          en_before, en_rest = text.split(en_start, 1)
          _, en_after = en_rest.split(en_end, 1)
          text = en_before.rstrip() + '\n\n' + en_end + en_after

          path.write_text(text)
          PY

      - name: Verify and commit README-only result
        shell: bash
        run: |
          rm -f .github/workflows/profile-remove-duplicate-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text()
          assert '### حاجات لسه بتعلمها، بس عندي شغل تقدر تفتحه وتحكم بنفسك' not in text
          assert '### Things I\'m still learning, but can already show work for' not in text
          assert text.count('### عندك <span dir="ltr">Job Offer</span>؟') == 1
          assert text.count('### Have a job offer?') == 1
          assert '## Public systems' in text
          PY

          git diff --cached --check
          git commit -m "docs(profile): remove duplicate project proof lists"
          git push origin HEAD:profile/remove-duplicate-proof-list
