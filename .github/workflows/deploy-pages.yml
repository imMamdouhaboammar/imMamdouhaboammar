name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'portfolio/**'
      - 'REPOSITORIES.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the committed portfolio HTML matches its source
        run: |
          node portfolio/build.mjs
          git diff --exit-code -- portfolio/index.html portfolio/ar/index.html \
            || { echo "::error::portfolio HTML is stale. Run 'node portfolio/build.mjs' and commit the result."; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
